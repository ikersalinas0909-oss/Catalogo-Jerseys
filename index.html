
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ouyang MX | Catálogo de Fútbol</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --black:#101010;
    --dark:#171717;
    --gray:#6b6b6b;
    --light:#f5f6f8;
    --white:#ffffff;
    --green:#00b86b;
    --border:#e8e8e8;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--light);
    color:#111;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(16,16,16,.96);
    backdrop-filter:blur(15px);
    color:white;
    padding:16px 5%;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
}

.navbar{
    max-width:1400px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:25px;
}

.logo{
    font-size:24px;
    font-weight:900;
    white-space:nowrap;
}

.logo span{
    color:var(--green);
}

.search-container{
    flex:1;
    position:relative;
}

.search{
    width:100%;
    height:48px;
    border:none;
    outline:none;
    border-radius:30px;
    padding:0 50px 0 20px;
    font-size:15px;
}

.search-icon{
    position:absolute;
    right:18px;
    top:14px;
    font-size:18px;
}

/* ================= HERO ================= */

.hero{
    background:
    radial-gradient(circle at 80% 20%,rgba(0,184,107,.25),transparent 30%),
    linear-gradient(135deg,#0c0c0c,#222);
    color:white;
    padding:70px 5%;
}

.hero-content{
    max-width:1400px;
    margin:auto;
}

.hero small{
    color:#00d47b;
    font-weight:bold;
    letter-spacing:1px;
}

.hero h1{
    font-size:clamp(40px,6vw,75px);
    max-width:850px;
    line-height:1;
    margin:15px 0;
}

.hero p{
    max-width:650px;
    color:#c7c7c7;
    font-size:17px;
    line-height:1.6;
}

/* ================= CATEGORIES ================= */

.categories-wrapper{
    background:white;
    border-bottom:1px solid var(--border);
}

.categories{
    max-width:1400px;
    margin:auto;
    padding:18px 5%;
    display:flex;
    gap:9px;
    overflow-x:auto;
}

.categories::-webkit-scrollbar{
    height:4px;
}

.category{
    border:1px solid #ddd;
    background:white;
    border-radius:30px;
    padding:10px 17px;
    cursor:pointer;
    white-space:nowrap;
    transition:.2s;
    font-size:13px;
}

.category:hover{
    border-color:#111;
}

.category.active{
    background:#111;
    color:white;
    border-color:#111;
}

/* ================= MAIN ================= */

main{
    max-width:1400px;
    margin:auto;
    padding:35px 5% 80px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.topbar h2{
    font-size:27px;
}

.counter{
    margin-top:5px;
    color:#777;
    font-size:14px;
}

.sort{
    border:1px solid #ddd;
    background:white;
    padding:11px 15px;
    border-radius:10px;
    outline:none;
}

/* ================= GRID ================= */

.products{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(230px,1fr));
    gap:20px;
}

/* ================= PRODUCT ================= */

.product{
    background:white;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #eee;
    transition:.25s;
}

.product:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 35px rgba(0,0,0,.12);
}

.product-image{
    height:290px;
    position:relative;
    background:#eee;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.35s;
}

.product:hover .product-image img{
    transform:scale(1.06);
}

.badge{
    position:absolute;
    top:12px;
    left:12px;
    background:#111;
    color:white;
    border-radius:20px;
    padding:7px 10px;
    font-size:10px;
    font-weight:bold;
}

.favorite{
    position:absolute;
    top:12px;
    right:12px;
    width:37px;
    height:37px;
    border:none;
    border-radius:50%;
    background:white;
    cursor:pointer;
    font-size:19px;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.favorite.active{
    color:#e63946;
}

.product-info{
    padding:17px;
}

.product-category{
    color:#888;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:7px;
}

.product-title{
    font-size:16px;
    line-height:1.35;
    min-height:43px;
}

.product-details{
    display:flex;
    gap:7px;
    margin:13px 0;
    flex-wrap:wrap;
}

.tag{
    background:#f1f1f1;
    padding:6px 9px;
    border-radius:7px;
    font-size:10px;
    color:#555;
}

.view-product{
    display:block;
    text-decoration:none;
    text-align:center;
    background:#111;
    color:white;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    font-weight:bold;
    transition:.2s;
}

.view-product:hover{
    background:var(--green);
}

/* ================= EMPTY ================= */

.empty{
    display:none;
    text-align:center;
    padding:90px 20px;
}

.empty-icon{
    font-size:50px;
    margin-bottom:15px;
}

.empty h2{
    margin-bottom:8px;
}

.empty p{
    color:#777;
}

/* ================= FOOTER ================= */

footer{
    background:#101010;
    color:#888;
    padding:40px 5%;
    text-align:center;
}

footer strong{
    color:white;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    header{
        padding:13px 4%;
    }

    .navbar{
        flex-direction:column;
        align-items:stretch;
        gap:12px;
    }

    .logo{
        text-align:center;
    }

    .hero{
        padding:45px 5%;
    }

    .hero h1{
        font-size:43px;
    }

    main{
        padding:25px 4% 60px;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .sort{
        width:100%;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:11px;
    }

    .product-image{
        height:220px;
    }

    .product-info{
        padding:12px;
    }

    .product-title{
        font-size:13px;
    }

    .view-product{
        font-size:11px;
        padding:10px;
    }
}

@media(max-width:380px){

    .products{
        grid-template-columns:1fr;
    }

    .product-image{
        height:300px;
    }
}
</style>
</head>


<body>


<!-- ================= HEADER ================= -->

<div class="navbar">

<div class="logo">
OUYANG<span>MX</span>
</div>

<div class="search-container">

id="search"

>

<section class="hero">

Encuentra tu jersey.

<div class="categories-wrapper">

<button

</div>

</div>



<!-- ================= MAIN ================= -->

<main>

<div class="topbar">

<div>

<h2>Jerseys</h2>

<p
class="counter"
id="counter">

</p>

<select
class="sort"
id="sort">

</option>

</div>


<div
class="products"
id="products">
</div>


<div
class="empty"
id="empty">

<div class="empty-icon">
🔎
</div>

<h2>
No encontramos ese producto
</h2>

<p>
Prueba buscando otro equipo o temporada.
</p>

</div>

</main>



<!-- ================= FOOTER ================= -->

<footer>

<p>
<strong>OUYANG MX</strong>
</p>

<p>
Catálogo de productos · Fútbol
</p>

<p style="margin-top:10px;">
© 2026
</p>

</footer>



<script>

/*
=========================================================
                 BASE DE PRODUCTOS
=========================================================

IMPORTANTE:

Para agregar un jersey copia este formato:

{
    name: "Nombre del jersey",
    category: "Premier League",
    type: "Player Version",
    season: "2026/27",
    team: "Arsenal",
    image: "URL-DE-LA-IMAGEN",
    url: "URL-DEL-ALBUM-YUPOO"
}

=========================================================
*/


const products = [

/* ================= PREMIER LEAGUE ================= */

{

    type: "Player Version",

    team: "Arsenal",

{

{

    category: "Premier League",

    season: "2026/27",
    team: "Liverpool",

    image: "https://via.placeholder.com/600x750?text=Liverpool",

},

{
    name: "Manchester City Home Jersey",
    category: "Premier League",
    type: "Player Version",
    season: "2026/27",
    team: "Manchester City",

    image: "https://via.placeholder.com/600x750?text=Manchester+City",

    url: "https://8618320710438.x.yupoo.com/"
},

{

    category: "Premier League",
    type: "Player Version",
    season: "2026/27",
    team: "Manchester United",

    image: "https://via.placeholder.com/600x750?text=Manchester+United",

    url: "https://8618320710438.x.yupoo.com/"
},


/* ================= LA LIGA ================= */

{
    name: "Barcelona Home Jersey",
    category: "La Liga",
    type: "Player Version",
    season: "2026/27",
    team: "Barcelona",

    image: "https://via.placeholder.com/600x750?text=Barcelona",

    url: "https://8618320710438.x.yupoo.com/"
},

{
    name: "Real Madrid Home Jersey",
    category: "La Liga",
    type: "Player Version",
    season: "2026/27",
    team: "Real Madrid",

    image: "https://via.placeholder.com/600x750?text=Real+Madrid",

    url: "https://8618320710438.x.yupoo.com/"
},

{
    name: "Atlético Madrid Home Jersey",
    category: "La Liga",
    type: "Player Version",
    season: "2026/27",
    team: "Atlético Madrid",

    image: "https://via.placeholder.com/600x750?text=Atletico+Madrid",

    url: "https://8618320710438.x.yupoo.com/"
},


/* ================= SERIE A ================= */

{
    name: "AC Milan Home Jersey",
    category: "Serie A",
    type: "Player Version",
    season: "2026/27",
    team: "AC Milan",

    image: "https://via.placeholder.com/600x750?text=AC+Milan",

    url: "https://8618320710438.x.yupoo.com/"
},

{
    name: "Inter Milan Home Jersey",
    category: "Serie A",

    url: "https://8618320710438.x.yupoo.com/"

    image: "https://via.placeholder.com/600x750?text=Juventus",

},

{

    team: "Bayern Munich",

    image: "https://via.placeholder.com/600x750?text=Bayern",

    url: "https://8618320710438.x.yupoo.com/"
},


/* ================= LIGUE 1 ================= */

{
    name: "PSG Home Jersey",
    category: "Ligue 1",
    type: "Player Version",
    season: "2026/27",
    team: "PSG",

    image: "https://via.placeholder.com/600x750?text=PSG",

    url: "https://8618320710438.x.yupoo.com/"
},


/* ================= MEXICO ================= */

{
    name: "México Home Jersey",
    category: "México",
    type: "Selección",
    season: "2026",
    team: "México",

    image: "https://via.placeholder.com/600x750?text=Mexico",

    url: "https://8618320710438.x.yupoo.com/"
},


/* ================= RETRO ================= */

{
    name: "Barcelona Retro Jersey",
    category: "Retro",
    type: "Retro",
    season: "Classic",
    team: "Barcelona",

    image: "https://via.placeholder.com/600x750?text=Barcelona+Retro",

    url: "https://8618320710438.x.yupoo.com/"
}

];



/*
=========================================================
VARIABLES
=========================================================
*/

let currentCategory = "Todos";
let searchTerm = "";



/*
=========================================================
MOSTRAR PRODUCTOS
=========================================================
*/

function renderProducts(){

    let results = products.filter(product => {

        const categoryMatch =
            currentCategory === "Todos" ||
            product.category === currentCategory;

        const searchableText = (

            product.name + " " +
            product.category + " " +
            product.type + " " +
            product.season + " " +
            product.team

        ).toLowerCase();

        const searchMatch =
            searchableText.includes(
                searchTerm.toLowerCase()
            );

        return categoryMatch && searchMatch;

    });


    /*
    ORDENAR
    */

    const sort =
        document.getElementById("sort").value;

    if(sort === "az"){

        results.sort((a,b)=>
            a.name.localeCompare(b.name)
        );

    }

    if(sort === "za"){

        results.sort((a,b)=>
            b.name.localeCompare(a.name)
        );

    }


    /*
    CONTADOR
    */

    document.getElementById("counter")
        .textContent =
        results.length +
        (results.length === 1
        ? " producto"
        : " productos");


    /*
    CONTENEDOR
    */

    const container =
        document.getElementById("products");

    const empty =
        document.getElementById("empty");

    container.innerHTML = "";


    /*
    SIN RESULTADOS
    */

    if(results.length === 0){

        empty.style.display = "block";

        return;

    }

    empty.style.display = "none";


    /*
    CREAR TARJETAS
    */

    results.forEach((product,index)=>{

        const card =
        document.createElement("div");

        card.className = "product";


        card.innerHTML = `

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy"
                >

                <span class="badge">
                    ${product.category}
                </span>

                <button
                    class="favorite"
                    onclick="toggleFavorite(this)"
                    aria-label="Agregar a favoritos">

                    ♡

                </button>

            </div>


            <div class="product-info">

                <div class="product-category">
                    ${product.team}
                </div>

                <h3 class="product-title">
                    ${product.name}
                </h3>


                <div class="product-details">

                    <span class="tag">
                        ${product.season}
                    </span>

                    <span class="tag">
                        ${product.type}
                    </span>

                </div>


                <a
                    class="view-product"
                    href="${product.url}"
                    target="_blank"
                    rel="noopener noreferrer">

                    Ver producto →

                </a>

            </div>

        `;


        container.appendChild(card);

    });

}



/*
=========================================================
BUSCADOR
=========================================================
*/

document
.getElementById("search")
.addEventListener("input",function(){

    searchTerm = this.value;

    renderProducts();

});



/*
=========================================================
CATEGORÍAS
=========================================================
*/

document
.querySelectorAll(".category")
.forEach(button=>{

    button.addEventListener("click",function(){

        document
        .querySelectorAll(".category")
        .forEach(btn =>
            btn.classList.remove("active")
        );


        this.classList.add("active");


        currentCategory =
            this.dataset.category;


        renderProducts();

    });

});



/*
=========================================================
ORDEN
=========================================================
*/

document
.getElementById("sort")
.addEventListener(
    "change",
    renderProducts
);



/*
=========================================================
FAVORITOS
=========================================================
*/

function toggleFavorite(button){

    button.classList.toggle("active");

    if(button.classList.contains("active")){

        button.innerHTML = "♥";

    }else{

        button.innerHTML = "♡";

    }

}



/*
=========================================================
INICIAR
=========================================================
*/

renderProducts();

</script>

</body>
</html>
