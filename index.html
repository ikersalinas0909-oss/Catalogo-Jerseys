
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ouyang Catalog México</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6f8;
    color:#111;
}

/* HEADER */
header{
    background:#111;
    color:white;
    padding:18px 6%;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 20px rgba(0,0,0,.15);
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    font-size:24px;
    font-weight:800;
}

.logo span{
    color:#00d084;
}

.search{
    flex:1;
    max-width:600px;
    position:relative;
}

.search input{
    width:100%;
    padding:15px 45px 15px 18px;
    border-radius:30px;
    border:none;
    outline:none;
    font-size:15px;
}

.search-icon{
    position:absolute;
    right:18px;
    top:14px;
}

/* HERO */
.hero{
    padding:60px 6%;
    background:linear-gradient(135deg,#111,#242424);
    color:white;
}

.hero h1{
    font-size:clamp(35px,5vw,65px);
    max-width:800px;
    margin-bottom:15px;
}

.hero p{
    color:#bbb;
    font-size:17px;
    max-width:650px;
}

/* CATEGORIES */
.categories{
    padding:30px 6% 10px;
    overflow-x:auto;
    display:flex;
    gap:10px;
}

.category{
    border:none;
    padding:11px 18px;
    border-radius:30px;
    background:white;
    cursor:pointer;
    white-space:nowrap;
    transition:.2s;
}

.category:hover,
.category.active{
    background:#111;
    color:white;
}

/* PRODUCTS */
.container{
    padding:30px 6% 70px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    gap:20px;
}

.count{
    color:#666;
}

.sort{
    padding:10px 14px;
    border-radius:10px;
    border:1px solid #ddd;
    background:white;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}

/* CARD */
.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.card-image{
    height:260px;
    background:#eee;
    position:relative;
    overflow:hidden;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.3s;
}

.card:hover img{
    transform:scale(1.05);
}

.badge{
    position:absolute;
    top:12px;
    left:12px;
    background:#111;
    color:white;
    padding:7px 10px;
    border-radius:20px;
    font-size:11px;
}

.favorite{
    position:absolute;
    right:12px;
    top:12px;
    width:35px;
    height:35px;
    border-radius:50%;
    border:none;
    background:white;
    cursor:pointer;
    font-size:17px;
}

.card-content{
    padding:17px;
}

.category-name{
    font-size:12px;
    color:#888;
    margin-bottom:7px;
}

.card h3{
    font-size:16px;
    margin-bottom:12px;
    line-height:1.35;
}

.info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.tag{
    background:#f0f0f0;
    padding:6px 9px;
    border-radius:8px;
    font-size:11px;
}

.view{
    width:100%;
    border:none;
    background:#111;
    color:white;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.view:hover{
    background:#00a86b;
}

/* EMPTY */
.empty{
    display:none;
    text-align:center;
    padding:80px 20px;
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#777;
}

/* FOOTER */
footer{
    background:#111;
    color:#aaa;
    text-align:center;
    padding:30px;
    font-size:13px;
}

/* MOBILE */
@media(max-width:600px){

    header{
        padding:15px 4%;
    }

    .nav{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        max-width:none;
    }

    .hero{
        padding:40px 5%;
    }

    .container{
        padding:25px 4%;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .card-image{
        height:210px;
    }

    .card-content{
        padding:12px;
    }

    .card h3{
        font-size:14px;
    }

    .topbar{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
OUYANG<span>MX</span>
</div>

<div class="search">
<input
type="text"
id="search"
placeholder="Buscar equipo, jersey, temporada..."
>
<span class="search-icon">🔎</span>
</div>

</div>

</header>


<section class="hero">

<h1>Catálogo de productos</h1>

<p>
Encuentra rápidamente jerseys, ropa deportiva y otros productos.
Busca por equipo, liga, temporada o tipo de producto.
</p>

</section>


<div class="categories">

<button class="category active" data-category="Todos">
Todos
</button>

<button class="category" data-category="Premier League">
🇬🇧 Premier League
</button>

<button class="category" data-category="Serie A">
🇮🇹 Serie A
</button>

<button class="category" data-category="La Liga">
🇪🇸 La Liga
</button>

<button class="category" data-category="México">
🇲🇽 México
</button>

<button class="category" data-category="Bundesliga">
🇩🇪 Bundesliga
</button>

<button class="category" data-category="NBA">
🏀 NBA
</button>

<button class="category" data-category="NFL">
🏈 NFL
</button>

<button class="category" data-category="Shorts">
👖 Shorts
</button>

<button class="category" data-category="Sneakers">
👟 Sneakers
</button>

<button class="category" data-category="Entrenamiento">
🏋️ Entrenamiento
</button>

</div>


<main class="container">

<div class="topbar">

<div>
<h2>Productos</h2>
<p class="count" id="count"></p>
</div>

<select class="sort" id="sort">
<option value="default">Ordenar</option>
<option value="az">Nombre A-Z</option>
<option value="za">Nombre Z-A</option>
</select>

</div>


<div class="grid" id="products"></div>


<div class="empty" id="empty">

<h2>No encontramos productos</h2>

<p>
Prueba con otro equipo, liga o palabra.
</p>

</div>

</main>


<footer>

© 2026 Ouyang MX · Catálogo

</footer>


<script>

/*
====================================================
PRODUCTOS
====================================================

Aquí agregas los productos.

Solo cambia:
name
category
type
image
url

*/

const products = [

{
name:"2026/27 Arsenal Home Jersey",
category:"Premier League",
type:"Jersey",
image:"https://via.placeholder.com/500x600?text=Arsenal",
url:"https://8618320710438.x.yupoo.com/"
},

{
name:"2026/27 Chelsea Away Jersey",
category:"Premier League",
type:"Jersey",
image:"https://via.placeholder.com/500x600?text=Chelsea",
url:"https://8618320710438.x.yupoo.com/"
},

{
name:"2026/27 AC Milan Away Jersey",
category:"Serie A",
type:"Jersey",
image:"https://via.placeholder.com/500x600?text=AC+Milan",
url:"https://8618320710438.x.yupoo.com/"
},

{
name:"2026/27 Barcelona Jersey",
category:"La Liga",
type:"Jersey",
image:"https://via.placeholder.com/500x600?text=Barcelona",
url:"https://8618320710438.x.yupoo.com/"
},

{
name:"México Jersey",
category:"México",
type:"Jersey",
image:"https://via.placeholder.com/500x600?text=Mexico",
url:"https://8618320710438.x.yupoo.com/"
},

{
name:"NBA Basketball Jersey",
category:"NBA",
type:"Basketball",
image:"https://via.placeholder.com/500x600?text=NBA",
url:"https://8618320710438.x.yupoo.com/"
},

{
name:"NFL Jersey",
category:"NFL",
type:"Football",
image:"https://via.placeholder.com/500x600?text=NFL",
url:"https://8618320710438.x.yupoo.com/"
},

{
name:"Football Shorts",
category:"Shorts",
type:"Shorts",
image:"https://via.placeholder.com/500x600?text=Shorts",
url:"https://8618320710438.x.yupoo.com/"
}

];


let currentCategory = "Todos";
let searchTerm = "";


/* MOSTRAR PRODUCTOS */

function renderProducts(){

let result = products.filter(product => {

const matchesCategory =
currentCategory === "Todos" ||
product.category === currentCategory;

const text =
(product.name + " " +
product.category + " " +
product.type).toLowerCase();

const matchesSearch =
text.includes(searchTerm.toLowerCase());

return matchesCategory && matchesSearch;

});


/* ORDEN */

const sort = document.getElementById("sort").value;

if(sort === "az"){
result.sort((a,b)=>a.name.localeCompare(b.name));
}

if(sort === "za"){
result.sort((a,b)=>b.name.localeCompare(a.name));
}


/* CONTADOR */

document.getElementById("count").textContent =
result.length + " productos encontrados";


/* HTML */

const container = document.getElementById("products");

container.innerHTML = "";


if(result.length === 0){

document.getElementById("empty").style.display = "block";

}else{

document.getElementById("empty").style.display = "none";

result.forEach((product,index)=>{

container.innerHTML += `

<div class="card">

<div class="card-image">

<img
src="${product.image}"
alt="${product.name}"
loading="lazy"
>

<span class="badge">
${product.category}
</span>

<button
class="favorite"
onclick="favorite(${index})">
♡
</button>

</div>

<div class="card-content">

<div class="category-name">
${product.type}
</div>

<h3>
${product.name}
</h3>

<div class="info">

<span class="tag">
Catálogo
</span>

</div>

<button
class="view"
onclick="window.open('${product.url}','_blank')">

Ver producto →

</button>

</div>

</div>

`;

});

}

}


/* BUSCADOR */

document.getElementById("search")
.addEventListener("input",function(){

searchTerm = this.value;

renderProducts();

});


/* CATEGORÍAS */

document.querySelectorAll(".category")
.forEach(button=>{

button.addEventListener("click",function(){

document
.querySelectorAll(".category")
.forEach(btn=>btn.classList.remove("active"));

this.classList.add("active");

currentCategory = this.dataset.category;

renderProducts();

});

});


/* ORDEN */

document.getElementById("sort")
.addEventListener("change",renderProducts);


/* FAVORITOS */

function favorite(index){

alert("Producto agregado a favoritos");

}


/* INICIAR */

renderProducts();

</script>

</body>
</html>
